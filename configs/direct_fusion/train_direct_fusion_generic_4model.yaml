# 通用 4 模型直融 + proprio（等价于原 train_direct_fusion_offline_ws1_proprio.yaml）
data:
  robotwin_data_root: /home/gl/RoboTwin/data
  task_config: demo_clean
  camera_name: head_camera
  tasks: [lift_pot]
  horizon: 8
  n_obs_steps: 3
  use_left_arm: true
  use_right_arm: true
  fuse_arms: true
  include_gripper: true

  model_names: [croco, vggt, dinov3, da3]
  vis_zarr_roots:
    - /home/gl/RoboTwin/policy/DP2DP3/features_model/rgb_dataset_ws1/features_croco_encoder_dict_unified_zarr
    - /home/gl/RoboTwin/policy/DP2DP3/features_model/rgb_dataset_ws1/features_vggt_encoder_dict_unified_zarr
    - /home/gl/RoboTwin/policy/DP2DP3/features_model/rgb_dataset_ws1/features_dinov3_encoder_dict_unified_zarr
    - /home/gl/RoboTwin/policy/DP2DP3/features_model/rgb_dataset_ws1/features_da3_encoder_dict_unified_zarr

fusion:
  type: weighted
  out_dim: 1280

policy:
  num_inference_steps: 100

train:
  epochs: 600
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.000001
  num_workers: 4

device:
  gpu_ids: [0]

checkpoint:
  save_dir: /home/gl/RoboTwin/policy/DP2DP3/checkpoints_direct_fusion_ws1/lift_pot-demo_clean-50-0-4model-proprio
  save_every: 100
  expert_data_num: 50
