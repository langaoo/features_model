# ===========================
# 直接融合训练配置 (无对齐模块)
# ===========================
# 目的: 测试是否是对齐模块破坏了特征

# 数据路径
data:
  robotwin_data_root: /home/gl/RoboTwin/data
  task_config: demo_clean
  camera_name: head_camera
  
  tasks: 
    - lift_pot
  
  # 数据采样
  horizon: 4
  n_obs_steps: 4
  
  # 双臂配置
  use_left_arm: true
  use_right_arm: true
  fuse_arms: true
  include_gripper: true

# 融合配置
fusion:
  type: weighted  # 'weighted', 'concat', 'mean'
  out_dim: 1280   # 融合后的特征维度

# 策略网络
policy:
  num_inference_steps: 100

# 训练配置
train:
  epochs: 1000
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.000001

# 设备配置
device:
  gpu_ids: [0, 1]

# Checkpoint配置
checkpoint:
  save_dir: /home/gl/RoboTwin/policy/DP2DP3/checkpoints_direct_fusion/lift_pot-demo_clean-50-0
  save_every: 500
  expert_data_num: 50
