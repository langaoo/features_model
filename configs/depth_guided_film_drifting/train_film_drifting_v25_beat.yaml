# DA3-FiLM + Drifting Head V25 — beat_block_hammer
# =============================================================
# V25 设计目标: Hybrid Drifting + BC Anchor
#
# 核心创新:
#   在 drifting loss 基础上增加 BC 正则项:
#     loss = drifting_loss + λ * MSE(gen_mean, expert)
#   λ = 0.1 (轻量，不干扰前期 drifting 动态)
#
# 理论依据:
#   - 训练前期 gen 远离 expert → drifting loss 主导 (V 大)
#   - 训练后期 gen 接近 expert → V→0 → drifting 梯度变成噪声
#   - BC anchor 在 V→0 时提供稳定的指向 expert 的梯度
#   - 类似 RL 中 PPO 的 entropy bonus 防止 policy collapse
#
# 其余参数与 V23 相同:
#   - batch_size=128, lr=1e-4, ema=0.999 (对齐 DP)
#   - K=32, drift_scale=50.0 constant, temp=1.0
# =============================================================

data:
  zarr_base: /home/gl/RoboTwin/policy/DP2DP3/data
  task_config: demo_clean
  camera_name: head_camera
  tasks:
    - beat_block_hammer
  horizon: 8
  n_obs_steps: 3
  n_action_steps: 6
  use_left_arm: true
  use_right_arm: true
  fuse_arms: true
  include_gripper: true

encoder:
  semantic_in_dim: 768
  geometric_in_dim: 2048
  proj_dim: 256
  film_hidden: 256
  out_dim: 1280
  with_pos_enc: true
  dropout: 0.1
  max_tokens: 196

drifting:
  temp_scale: 1.0
  K: 32
  drift_scale: 50.0
  drift_scale_schedule: "constant"
  bc_lambda: 0.1

train:
  epochs: 600
  batch_size: 128
  grad_accum_steps: 1
  lr: 0.0001
  lr_scheduler: cosine
  lr_warmup_steps: 500
  weight_decay: 0.000001
  num_workers: 4
  ema_decay: 0.999

precompute_batch_size: 32
offload_backbone_after_precompute: true

device:
  gpu_ids: [0]

checkpoint:
  save_dir: /home/gl/RoboTwin/policy/DP2DP3/checkpoints_film_drifting/beat_block_hammer-demo_clean-v25-bc0.1-50-0
  save_every: 100
  expert_data_num: 50

wandb:
  enable: true
  project: geo_drift_policy
  entity: ""
  run_name: drifting_v25_beat_bc0.1
  mode: offline
