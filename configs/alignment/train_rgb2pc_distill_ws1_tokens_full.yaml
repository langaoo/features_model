# RGB2PC 对齐训练配置（ws1 + 局部ULIP token）

# 任务

tasks:
  - lift_pot-demo_clean-50_sapien_head_camera

episodes: 0

pc_root: /home/gl/RoboTwin/policy/DP2DP3/features_model/pc_dataset/ulip_point_tokens_zarr

vis_zarr_roots:
  - /home/gl/RoboTwin/policy/DP2DP3/features_model/rgb_dataset_ws1/features_croco_encoder_dict_unified_zarr
  - /home/gl/RoboTwin/policy/DP2DP3/features_model/rgb_dataset_ws1/features_vggt_encoder_dict_unified_zarr
  - /home/gl/RoboTwin/policy/DP2DP3/features_model/rgb_dataset_ws1/features_dinov3_encoder_dict_unified_zarr
  - /home/gl/RoboTwin/policy/DP2DP3/features_model/rgb_dataset_ws1/features_da3_encoder_dict_unified_zarr

# 训练

device: cuda
amp: true
steps: 4000
batch_size: 32
grad_accum_steps: 4
lr: 0.0003
seed: 0
tau: 0.07
num_workers: 8

# 蒸馏目标

fuse_dim: 1280
fusion: weighted
moe_hidden: 1280
loss_mse: 1.0
loss_rgb: 0.1
rgb_tau: 0.07

# 采样

sample_unit: step
window_agg: mean
student_tokens: 1024
teacher_points: 1024
student_pool: tokens
token_pool: attn
loss_local: 0.1
local_tau: 0.07
loss_pool: 0.1

# Residual Adapter + Chamfer

residual_adapter: true
residual_alpha: 0.3
residual_zero_init: true
loss_chamfer: 0.2
chamfer_max_tokens: 1024
chamfer_max_points: 1024

# 配对

strict_pairing: true
pairing_fallback: error
skip_nonfinite: true

# 性能/日志

pack_cache_size: 4
log_every: 50
mem_every: 0

tqdm: true

# wandb

wandb: false
wandb_project: rgb2pc_distill
wandb_entity: ""
wandb_run_name: ""

# ckpt

save_dir: /home/gl/RoboTwin/policy/DP2DP3/features_model/outputs/train_rgb2pc_runs/run_ws1_tokens_full
save_every: 500
