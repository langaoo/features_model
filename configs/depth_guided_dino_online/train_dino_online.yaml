# 消融实验: 纯 DINOv3 训练配置 (无 DA3 几何调制)
# ==================================================
# 实验意图:
#   对比 FiLM+DA3 (32% on beat_block_hammer) vs 纯 DINOv3
#   若 DINO-only > 32%, 说明 DA3 在锤击任务中是主动干扰信号
#
# 用法:
#   cd /home/gl/RoboTwin/policy/DP2DP3/features_model
#   python tools/depth_guided_dino_online/train_dino_online.py \
#     --config configs/depth_guided_dino_online/train_dino_online.yaml

data:
  zarr_base: /home/gl/RoboTwin/policy/DP2DP3/data
  task_config: demo_clean
  camera_name: head_camera
  tasks:
    - beat_block_hammer
  horizon: 8
  n_obs_steps: 3
  n_action_steps: 6
  use_left_arm: true
  use_right_arm: true
  fuse_arms: true
  include_gripper: true

encoder:
  # 只有 DINOv3(语义), 无几何调制
  semantic_in_dim: 768     # DINOv3 输出维度
  proj_dim: 256
  out_dim: 1280
  with_pos_enc: true
  dropout: 0.1
  max_tokens: 196

policy:
  num_inference_steps: 100

train:
  epochs: 600
  batch_size: 128
  lr: 0.0001
  weight_decay: 0.000001
  num_workers: 4

precompute_batch_size: 32
offload_backbone_after_precompute: true

device:
  gpu_ids: [0]

checkpoint:
  save_dir: /home/gl/RoboTwin/policy/DP2DP3/checkpoints_dino_online/beat_block_hammer-demo_clean-50-0
  save_every: 100
  expert_data_num: 50
