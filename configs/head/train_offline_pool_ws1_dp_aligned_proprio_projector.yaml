# 方案A验证：pool_ws1 对齐特征 + 可学习 vis_projector + DP-Aligned Proprio
#
# 与 train_offline_pool_ws1_dp_aligned_proprio.yaml 的唯一区别：
# - 新增 vis_projector_type: mlp（在 obs_aligned 1280d 后加一个可学习的 MLP 投影层）
# - 这使得 pool_ws1 也有"可学习的特征变换层"，与 Direct Fusion 的 projectors 对应
# - 所有其他参数完全一致，确保控制变量

data:
  features_dataset_dir: /home/gl/RoboTwin/policy/DP2DP3/features_model/data/offline_features_pool_ws1_proprio_fixed

  # 数据提取已做时间偏移（agent_pos=vector[t], action=vector[t+1]）
  action_offset: 0

  horizon: 8
  n_obs_steps: 3
  camera_name: head_camera

  tasks:
    - lift_pot

  task_config: demo_clean
  use_left_arm: true
  use_right_arm: true
  include_gripper: true

encoder:
  checkpoint: /home/gl/RoboTwin/policy/DP2DP3/features_model/outputs/train_rgb2pc_runs/run_pool_ws1/ckpt_final.pt

train:
  epochs: 600
  batch_size: 32
  lr: 1e-4
  num_workers: 4
  optimizer: adamw
  weight_decay: 1e-6
  resume_ckpt: null

policy:
  type: OfficialDP
  use_official_dp: true
  num_inference_steps: 100
  # DP-Aligned proprio: 直接 concat，无需 MLP 参数
  use_proprio: true
  proprio_dim: 14
  # 方案A核心：加可学习的 vis_projector
  vis_projector_type: mlp   # "none" / "linear" / "mlp"
  vis_projector_dim: 1280   # 输出维度保持 1280

device:
  gpu_ids: [0, 1]

output:
  dir: /home/gl/RoboTwin/policy/DP2DP3/checkpoints
  save_every_n_epochs: 100

checkpoint:
  expert_data_num: 50
  ckpt_setting: demo_clean_pool_ws1_dp_aligned_proprio_projector
  seed: 0
