# 在线批量特征提取配置（Dual-Stream, place_a2b_left + 本体感知）

data:
  robotwin_data_root: /home/gl/RoboTwin/data
  task_config: demo_clean
  camera_name: head_camera

  tasks:
    - place_a2b_left

  horizon: 8
  n_obs_steps: 2

  use_left_arm: true
  use_right_arm: true
  fuse_arms: true
  include_gripper: true

encoder:
  # 多任务对齐模块（ws1 + tokens_full）
  checkpoint: /home/gl/RoboTwin/policy/DP2DP3/features_model/outputs/train_rgb2pc_runs/run_ws1_tokens_full_multitask/ckpt_step_0015000.pt
  freeze: true
  save_tokens: true

train:
  epochs: 600
  batch_size: 8
  batch_extract: true
  lr: 1e-4
  num_workers: 8
  optimizer: adamw
  weight_decay: 1e-6

policy:
  type: OfficialDP
  hidden_dim: 512
  use_official_dp: true
  num_inference_steps: 100
  use_tokens: true
  # 本体感知（可开关）
  use_proprio: true
  proprio_dim: 14
  proprio_mode: concat
  proprio_hidden: 256

device:
  gpu_ids: [0, 1]

output:
  dir: _runs/online_training_dual_stream
  save_every_n_epochs: 50
  run_name: null

checkpoint:
  expert_data_num: 50
  ckpt_setting: demo_clean_train_mtenc
  seed: 0

debug:
  print_config: true
  fast_dev_run: false
