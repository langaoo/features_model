# ===========================
# 在线训练配置 - 批量特征提取模式
# ===========================
# 适用场景: 在线训练需要更大的有效batchsize
# 速度: 中（批量提取特征，提升GPU利用率）
# 优点: batchsize真正生效，提升训练效率

# 数据路径
data:
  # RoboTwin 数据根目录（自动拼接路径）
  robotwin_data_root: /home/gl/RoboTwin/data  # RoboTwin 数据根目录
  task_config: demo_clean                 # 任务配置（demo_clean/demo_randomized等）
  camera_name: head_camera                     # 相机名称
  
  # 任务列表
  tasks: 
    - lift_pot
  
  # 数据采样 - 与直融/单模型保持一致
  horizon: 8
  n_obs_steps: 2
  
  # 双臂配置
  use_left_arm: true
  use_right_arm: true
  fuse_arms: true
  include_gripper: true

# 对齐编码器
encoder:
  checkpoint: /home/gl/RoboTwin/policy/DP2DP3/features_model/outputs/train_rgb2pc_runs/run_best_bs32/ckpt_final.pt
  freeze: true  # 冻结对齐编码器

# 训练配置
train:
  epochs: 500
  batch_size: 8      # ✓ 批量提取模式下可以使用更大的batchsize (8-32)
  batch_extract: true # ★ 关键参数: 启用批量特征提取模式
  lr: 1e-4
  num_workers: 8      # 批量模式下可以使用多worker
  
  # 优化器
  optimizer: adamw
  weight_decay: 1e-6

# 策略网络
policy:
  type: OfficialDP    # 策略类型: SimpleMLP | OfficialDP
  hidden_dim: 512
  
  # 正版DP配置（当type=OfficialDP时生效）
  use_official_dp: true  # 是否使用正版Diffusion Policy
  num_inference_steps: 100  # 扩散推理步数

# 设备配置
device:
  gpu_ids: [0, 1] 

# 输出
output:
  dir: _runs/online_training
  save_every_n_epochs: 50
  run_name: null  # null = 自动生成

# 标准化路径配置（新增）
# 用于保存到标准化的 checkpoints 目录
checkpoint:
  expert_data_num: 20           # 专家数据数量
  ckpt_setting: demo_randomized # checkpoint 设置（demo_clean/demo_randomized等）
  seed: 0                       # 随机种子

debug:
  print_config: true
  fast_dev_run: false  # true: 只跑1个batch用于快速调试
