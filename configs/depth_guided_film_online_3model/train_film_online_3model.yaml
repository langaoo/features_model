# 半在线 3 模型 DA3-FiLM 训练配置 (DINOv3 + CroCo + DA3)
# ==========================================================
# 与离线 4 模型版的对应:
#   离线: CroCo(1024) + VGGT(2048) + DINOv3(768) 三语义, DA3 调制 → 96%
#   本版: DINOv3(768) + CroCo(1024) 二语义, DA3 调制
#   差异: 去掉 VGGT, 其余架构完全一致 (concat_proj + FiLM)
#
# 用法:
#   cd /home/gl/RoboTwin/policy/DP2DP3/features_model
#   python tools/depth_guided_film_online_3model/train_film_online_3model.py \
#     --config configs/depth_guided_film_online_3model/train_film_online_3model.yaml

data:
  zarr_base: /home/gl/RoboTwin/policy/DP2DP3/data   # zarr 文件所在目录 (由 DP2DP3/process_data.py 生成)
  # zarr_base: /home/gl/RoboTwin/policy/DP/data  # 旧路径 (DP 目录, 已弃用)
  task_config: demo_clean
  camera_name: head_camera
  tasks:
    - lift_pot
  horizon: 8
  n_obs_steps: 3
  n_action_steps: 6              # ★ 对齐 robot_dp_14.yaml
  use_left_arm: true
  use_right_arm: true
  fuse_arms: true
  include_gripper: true

encoder:
  # 3 模型: DINOv3(语义) + CroCo(语义) + DA3(几何调制)
  semantic_in_dims: [768, 1024]   # DINOv3, CroCo
  geometric_in_dim: 2048          # DA3 输出维度
  proj_dim: 256
  film_hidden: 256
  out_dim: 1280
  semantic_fusion: concat_proj    # ★ 与离线版完全一致
  with_pos_enc: true
  dropout: 0.1
  max_tokens: 196

policy:
  num_inference_steps: 100

train:
  epochs: 600
  batch_size: 128             # zarr 缓存后无 backbone 开销, 可开大 batch
  lr: 0.0001
  weight_decay: 0.000001
  num_workers: 4

# 预提取 batch size (仅启动时用一次)
precompute_batch_size: 32
offload_backbone_after_precompute: true

device:
  gpu_ids: [0]

checkpoint:
  save_dir: /home/gl/RoboTwin/policy/DP2DP3/checkpoints_film_online_3model/lift_pot-demo_clean-50-0
  save_every: 100
  expert_data_num: 50
